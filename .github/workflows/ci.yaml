name: dive

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dive:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-compose
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t student-app:ci .

      - name: Dive CI check
        run: |
          docker run --rm -e CI=true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dive-ci:/.dive-ci:ro" \
            wagoodman/dive:latest student-app:ci --ci-config /.dive-ci